name: Build & Deploy Dashboard

# Dispara de 3 formas:
#  - workflow_dispatch : chamado pelo cron-job.org a cada 30 min (via API do GitHub)
#  - schedule          : backup nativo (o agendador do GitHub costuma atrasar; o
#                        cron-job.org e a fonte principal de pontualidade)
#  - push              : reconstroi quando o codigo muda
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [ main ]
    paths:
      - "build/**"
      - ".github/workflows/deploy.yml"

# contents: write so para empurrar o build na branch gh-pages (nunca na main);
# pages/id-token para o modo "GitHub Actions" do Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Nunca roda dois deploys ao mesmo tempo; nao cancela um deploy em andamento
concurrency:
  group: pages
  cancel-in-progress: false

# O Pages deste repo publica a partir da branch gh-pages (Settings -> Pages ->
# Deploy from a branch). Ele foi ligado assim porque o GITHUB_TOKEN nao consegue
# criar o site no modo "GitHub Actions", e o primeiro push da branch gh-pages
# liga o Pages sozinho. O workflow descobre o modo a cada execucao:
#  - build_type "workflow" (Source: GitHub Actions) -> upload + deploy-pages;
#  - qualquer outro (branch ou desligado)            -> forca o build na gh-pages.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      modo: ${{ steps.modo.outputs.modo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build dashboard (le as planilhas via CSV publico, somente leitura)
        run: python build/build.py --out dist/index.html

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Descobre como o Pages publica
        id: modo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          echo "Pages build_type: ${bt:-desligado}"
          if [ "$bt" = "workflow" ]; then
            echo "modo=actions" >> "$GITHUB_OUTPUT"
          else
            echo "modo=branch" >> "$GITHUB_OUTPUT"
          fi

      # Um commit orfao por execucao, com push forcado: a branch guarda so a
      # versao atual e nao cresce 48 commits por dia.
      - name: Publica na branch gh-pages
        if: steps.modo.outputs.modo == 'branch'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Atualiza a dash ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Upload artifact
        if: steps.modo.outputs.modo == 'actions'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.modo == 'actions'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
